name: Temporary CTK manual stills release build
on:
  push:
    branches: [fix/ctk-stills-manual-selection-only-20261113]
permissions:
  contents: write
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile CTK and run all Node regressions
        run: npm test
      - name: Commit generated hosted and standalone release assets
        run: |
          git add -- index.html dist/ favicon.svg manifest.json
          if git diff --cached --quiet; then
            echo "Generated assets match sources"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: compile CTK manual-only stills selection"
            git push origin HEAD:fix/ctk-stills-manual-selection-only-20261113
          fi
