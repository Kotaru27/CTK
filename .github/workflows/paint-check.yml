name: Selected button paint check
on:
  push:
    branches: [fix/green-theme-quiet-hovers-20261017]
    paths-ignore: ['docs/.paint-check/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: npm run build
      - name: Setup Playwright
        run: python3 -m pip install --quiet --break-system-packages playwright
      - name: Compare resting, hovered and mouse-out primary buttons
        run: |
          mkdir -p docs/.paint-check
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root=Path.cwd()
          results=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
            page=browser.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
            page.goto((root/'dist/creative-tools-standalone.html').as_uri(),wait_until='domcontentloaded')
            for section,mode,sel in [('section-stills-boards','story','#storySubModeToggle .liquid-btn.active-mode'),
                                     ('section-adlinks','downloader','#adDlDropZone label')]:
              for light in (False,True):
                page.evaluate('(light)=>document.body.classList.toggle("light-mode",light)',light)
                page.evaluate('([s,m])=>UI._openTool(s,m)',[section,mode])
                page.wait_for_timeout(450)
                button=page.locator(sel).first
                for stage in ('rest','hover','out'):
                  if stage=='hover':button.hover();page.wait_for_timeout(450)
                  if stage=='out':page.mouse.move(1390,73);page.wait_for_timeout(450)
                  state=button.evaluate("""e=>{
                    let s=getComputedStyle(e),r=e.getBoundingClientRect();
                    return {bg:s.backgroundColor,image:s.backgroundImage,color:s.color,shadow:s.boxShadow,
                      outline:s.outline,filter:s.filter,opacity:s.opacity,box:{x:r.x,y:r.y,width:r.width,height:r.height},
                      hit:document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.tagName}
                  }""")
                  filename='docs/.paint-check/'+section+('-light' if light else '-dark')+'-'+stage
                  png=root/(filename+'.jpg')
                  page.screenshot(path=str(png),type='jpeg',quality=85)
                  (root/(filename+'.b64')).write_text(base64.b64encode(png.read_bytes()).decode())
                  png.unlink()
                  results.append({'section':section,'light':light,'stage':stage,**state})
            browser.close()
          (root/'docs/.paint-check/results.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Store capture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.paint-check/
          git commit -m "test: captured button hover paint comparison"
          git push
