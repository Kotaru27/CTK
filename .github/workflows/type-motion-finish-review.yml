name: Type motion finish visual QA
on:
  push:
    branches: [design/typography-motion-finish-20261017]
    paths-ignore: ['docs/.finish-review/**']
permissions:
  contents: write
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and test every tool
        run: npm test
      - name: Browser setup
        run: python3 -m pip install --quiet --break-system-packages playwright
      - name: Check desktop visual state and capture
        run: |
          mkdir -p docs/.finish-review
          python3 - <<'PY'
          from pathlib import Path
          import base64, json
          from playwright.sync_api import sync_playwright
          root=Path.cwd()
          results=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
            page=browser.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
            page.goto((root/'dist/creative-tools-standalone.html').as_uri(),wait_until='domcontentloaded',timeout=30000)
            page.wait_for_timeout(750)
            for light in [False,True]:
              page.evaluate('(light)=>document.body.classList.toggle("light-mode",light)',light)
              for screen,section,mode in [('home',None,None),('logo','section-logo',None),('story','section-stills-boards','story'),('ad','section-adlinks','downloader')]:
                if section:page.evaluate('([section,mode])=>UI._openTool(section,mode)',[section,mode])
                else:page.evaluate('()=>UI._showHome()')
                page.wait_for_timeout(550)
                values=page.evaluate('''({screen,section})=>{
                  const h=document.querySelector('#view-home .home-heading');
                  const story=document.querySelector('#storyPreview');
                  const header=section?document.querySelector('#'+section+' .tool-header h2'):h;
                  const comp=getComputedStyle(header);
                  const btn=document.querySelector('#view-home .home-card');
                  return {screen,title:header?.textContent?.trim(),
                    font:comp.fontFamily,fontSize:comp.fontSize,tracking:comp.letterSpacing,
                    buttonTitles:document.querySelectorAll('#view-home .home-card').length,
                    overflow:document.documentElement.scrollWidth>innerWidth+4,
                    storyEmptyAfter:story?getComputedStyle(story,'::after').left:null,
                    storyEmptyTransform:story?getComputedStyle(story,'::after').transform:null,
                    tileDuration:btn?getComputedStyle(btn).animationDuration:null};
                }''',{'screen':screen,'section':section})
                assert not values['overflow'],values
                if screen=='home':assert values['buttonTitles']==8 and 'Instrument Serif' in values['font'],values
                if screen=='story':assert values['storyEmptyAfter']=='50%',values
                png=root/('docs/.finish-review/'+screen+('-light' if light else '-dark')+'.jpg')
                page.screenshot(path=str(png),type='jpeg',quality=57,animations='disabled')
                (png.with_suffix('.b64')).write_text(base64.b64encode(png.read_bytes()).decode())
                png.unlink()
                results.append({'light':light,**values})
            page.emulate_media(reduced_motion='reduce')
            page.evaluate('()=>UI._showHome()')
            page.wait_for_timeout(30)
            values=page.evaluate('''()=>({
              home:getComputedStyle(document.querySelector('.home-card')).animationDuration,
              nav:getComputedStyle(document.querySelector('.nav-item')).transitionDuration
            })''')
            assert values['home']=='0s' and values['nav']=='0s',values
            results.append({'reducedMotion':values})
            browser.close()
          (root/'docs/.finish-review/results.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - name: Commit generated releases and screenshot audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/ docs/.finish-review
          if ! git diff --cached --quiet; then
            git commit -m "test: synchronize final type/motion build and visual captures"
            git push
          fi
