name: CTK regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate bundled release and run tests
        run: npm test
      - name: Ensure compiled tool assets match modular source
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- dist/; then
            echo '::error::Compiled assets are stale. Run npm run build and commit dist/ alongside source changes. The root index.html is the legacy CTK bookmark notice.'
            git diff --stat -- dist/
            git diff -- dist/index.html dist/creative-tools-standalone.html | sed -n '1,140p'
            exit 1
          fi
