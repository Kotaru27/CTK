name: CTK regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate bundled release and run tests
        run: npm test
      - name: Ensure GitHub Pages artifacts match modular source
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- index.html dist/; then
            echo '::error::Pages artifacts are stale. Run npm run build and commit index.html and dist/ alongside source changes.'
            git diff --stat -- index.html dist/
            exit 1
          fi
