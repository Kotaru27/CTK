name: Forge eight-workspace motion audit
on:
  push:
    branches: [audit/forge-all-tool-motion-20261017, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser instrumentation
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Install local test-video encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Test source, build and standalone parity
        run: npm test
      - name: Start local Pages build
        run: |
          node scripts/dev.mjs > /tmp/forge-motion-audit.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/forge-motion-audit.log
          exit 1
      - name: Inspect all eight tool workspaces at desktop and QHD
        run: node scripts/audit-tool-motion.mjs
      - name: Inspect internal tool-to-tool navigation and tab switches
        run: node scripts/audit-tool-internal.mjs
      - name: Verify all 56 ordered tool-to-tool transitions and rapid interruption
        run: node scripts/audit-route-pairs.mjs
      - name: Inspect hover and focus motion coverage across all eight tools
        run: node scripts/audit-control-motion.mjs
      - name: Inspect responsive desktop layouts at laptop, Full HD and QHD
        run: node scripts/audit-responsive-desktop.mjs
      - name: Exercise populated workspaces and collect rendering telemetry
        run: node scripts/audit-populated-workspaces.mjs
      - name: Retain screenshot and telemetry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-eight-tool-motion-audit
          path: |
            artifacts/tool-motion/
            artifacts/desktop-responsive/
            artifacts/populated-workspaces/
          if-no-files-found: ignore
