name: Publish compiled Forge Pages assets
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build.mjs'
      - 'scripts/source-map.json'
      - 'tests/**'
      - '.github/workflows/sync-main-build.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: forge-main-pages-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and run regression suite from current main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          npm test
      - name: Commit the exact files served by GitHub Pages to main
        run: |
          git add -- index.html dist/
          if git diff --cached --quiet; then
            echo "Published assets already match source."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build published Forge assets from current main source"
            git push origin HEAD:main
          fi
      - name: Explicitly request GitHub Pages rebuild after bundle commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 3 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
