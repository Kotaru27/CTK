name: Temporary CTK compact Link Gen build
on:
  push:
    branches: [fix/ctk-link-folder-compact-row]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild hosted and standalone assets and run CTK regression suite
        run: npm test
      - name: Commit only generated Pages files to feature branch
        run: |
          git add -- index.html dist/ favicon.svg manifest.json
          if git diff --cached --quiet; then
            echo "No generated files changed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: regenerate CTK compact Ad Link Gen assets"
            git push origin HEAD:fix/ctk-link-folder-compact-row
          fi
