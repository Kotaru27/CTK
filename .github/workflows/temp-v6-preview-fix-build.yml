name: Temporary CTK V6 preview and quality build
on:
  push:
    branches: [fix/ctk-v6-preview-quality-20261113]
permissions:
  contents: write
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild CTK and verify all Node regressions
        run: npm test
      - name: Publish feature-branch compiled assets for exact source parity
        run: |
          git add -- dist/ index.html favicon.svg manifest.json
          if git diff --cached --quiet; then
            echo "Generated files unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: regenerate CTK V6 preview quality release assets"
            git push origin HEAD:fix/ctk-v6-preview-quality-20261113
          fi
