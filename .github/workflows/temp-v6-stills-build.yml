name: Temporary CTK V6 feature-branch verification and build
on:
  push:
    branches: [feature/ctk-v6-multivideo-stills]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile CTK and run the full regression suite
        run: npm test
      - name: Commit generated CTK release assets only
        run: |
          git add -- index.html dist/ favicon.svg manifest.json
          if git diff --cached --quiet; then
            echo "Generated assets already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: compile approved V6 multi-video stills for CTK"
            git push origin HEAD:feature/ctk-v6-multivideo-stills
          fi
