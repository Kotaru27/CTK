name: Build Ad Downloader design preview
on:
  push:
    branches: [design/ad-downloader-experience-v2]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all existing workflows and visual build
        run: npm test
      - name: Synchronize generated release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize Ad Downloader experience v2 bundles"
            git push
          fi
