name: Green theme and hover browser QA
on:
  push:
    branches: [fix/green-theme-quiet-hovers-20261017]
    paths-ignore: ['docs/.hover-review/**']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and all regressions
        run: npm test
      - name: Install desktop browser runner
        run: python3 -m pip install --quiet --break-system-packages playwright
      - name: Inspect green theme and button hover in desktop Chromium
        run: |
          mkdir -p docs/.hover-review
          python3 - <<'PY'
          import json,base64
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root=Path.cwd()
          cases=[
            ('logo','section-logo',None),
            ('pdf-image','section-pdf','convert'),
            ('image-splitter','section-pdf','split'),
            ('video-stills','section-stills-boards','video'),
            ('storyboard','section-stills-boards','story'),
            ('filmstrip','section-stills-boards','filmstrip'),
            ('link-gen','section-adlinks','gen'),
            ('ad-downloader','section-adlinks','downloader'),
            ('video-downloads','section-yt-helper',None),
          ]
          checks=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox'])
            page=browser.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
            errors=[]
            page.on('pageerror',lambda error: errors.append(str(error)[:200]))
            page.goto((root/'dist/creative-tools-standalone.html').as_uri(),wait_until='domcontentloaded',timeout=40000)
            page.wait_for_timeout(750)
            for light in (False,True):
              page.evaluate('(light)=>document.body.classList.toggle("light-mode",light)',light)
              for name,section,mode in cases:
                page.evaluate('([section,mode])=>UI._openTool(section,mode)',[section,mode])
                page.wait_for_timeout(350)
                rootEl=page.locator('#'+section)
                button=rootEl.locator('.liquid-btn:visible:not([disabled])').first
                result={'screen':name,'theme':'light' if light else 'dark','hasButton':button.count()>0}
                if button.count()>0:
                  button.scroll_into_view_if_needed(timeout=3500)
                  before=button.evaluate("""e=>{let s=getComputedStyle(e);return {transform:s.transform,translate:s.translate,shadow:s.boxShadow,background:s.backgroundColor,scale:s.scale}}""")
                  button.hover(timeout=3500)
                  page.wait_for_timeout(300)
                  after=button.evaluate("""e=>{let s=getComputedStyle(e);return {transform:s.transform,translate:s.translate,shadow:s.boxShadow,background:s.backgroundColor,scale:s.scale}}""")
                  result.update({'label':button.inner_text()[:38],'before':before,'after':after})
                  assert after['shadow']==before['shadow'],result
                  assert after['transform'] in ('none','matrix(1, 0, 0, 1, 0, 0)'),result
                  assert after['translate'] in ('none','0px','0px 0px'),result
                result['overflow']=page.evaluate('document.documentElement.scrollWidth>innerWidth+4')
                assert not result['overflow'],result
                checks.append(result)
                if name in ('storyboard','ad-downloader','logo'):
                  capture=root/('docs/.hover-review/'+name+('-light' if light else '-dark')+'.jpg')
                  page.screenshot(path=str(capture),type='jpeg',quality=65,animations='allow')
                  capture.with_suffix('.b64').write_text(base64.b64encode(capture.read_bytes()).decode())
                  capture.unlink()
            page.emulate_media(reduced_motion='reduce')
            page.evaluate('()=>UI._openTool("section-adlinks","downloader")')
            assert page.evaluate("getComputedStyle(document.querySelector('#adlinksTabContentDownloader .liquid-btn')).transitionDuration") in ('0s','1e-05s','.01ms'), 'Reduced-motion transitions remain enabled'
            checks.append({'pageErrors':errors})
            browser.close()
          (root/'docs/.hover-review/results.json').write_text(json.dumps(checks,indent=2))
          print(json.dumps(checks,indent=2))
          PY
      - name: Synchronize release and attach visual captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/ docs/.hover-review/
          if ! git diff --cached --quiet; then
            git commit -m "test: synchronize green theme and hover browser captures"
            git push
          fi
